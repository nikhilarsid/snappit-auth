# Test Profile Configuration
spring.application.name=snapitt-auth-service-test

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/snapitt-test
spring.data.mongodb.auto-index-creation=true

# Event Module
snapitt.event.db-name=snapitt-test
snapitt.event.worker-id=test-worker
snapitt.event.max-retries=3
snapitt.event.stale-lock-threshold-ms=5000
snapitt.event.recovery-interval-ms=1000

# JWT
application.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=604800000

# Cookie
app.cookie.secure=false

# Google OAuth (dummy for tests)
spring.security.oauth2.client.registration.google.client-id=test-google-client-id

# Upload
app.upload.dir=test-uploads

# Logging
logging.level.com.snapitt=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.data.mongodb.core=DEBUG
